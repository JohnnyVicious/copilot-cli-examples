name: Docs CI

on:
  pull_request:
    paths:
      - "docs/**"
      - "challenges/**"
      - "*.md"
      - ".github/workflows/docs-ci.yml"
      - "scripts/lint-challenges.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            docs/**/*.md
            challenges/**/*.md
            *.md

  spellcheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache cspell
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-cspell-v8
          restore-keys: |
            ${{ runner.os }}-cspell-

      - name: Install cspell
        run: npm install -g cspell@8

      - name: Run spellcheck
        run: |
          cspell --no-progress --show-suggestions \
            "docs/**/*.md" \
            "challenges/**/*.md" \
            "*.md" || true

  linkcheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run linkcheck
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --exclude-path results
            --exclude-path tests
            --exclude-path templates
            --exclude-path .github
            --max-retries 3
            --timeout 10
            "docs/**/*.md"
            "challenges/**/*.md"
            "*.md"
          fail: true

  lint-challenges:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate challenge structure
        run: bash scripts/lint-challenges.sh
